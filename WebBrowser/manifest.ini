[ABOUT]
NAME = Web Browser
AUTHOR = x4fab
VERSION = 1.3.0
DESCRIPTION = Experience the vast World Wide Web today! Also, this thing can turn webpages into AC apps.
REQUIRED_VERSION = 2578
URL = https://github.com/ac-custom-shaders-patch/app-csp-defaults/tree/main/WebBrowser

[CORE]
LAZY = $" read('csp/version', 0) >= 3974 and 'PARTIAL' or 'NONE " ; in 0.3.0-preview441, a new function
  ; `ac.overrideAppLazyFlag()` was added, so now browser can launch at start only if there is a pinned app.
PRELOAD_SQLITE = 1

[AWAKE_TRIGGERS]
URL = '^https?://'

[WINDOW_...]
ID = main
NAME = Web
ICON = icon.png
FUNCTION_MAIN = windowMain
FUNCTION_ON_HIDE = onHideWindowMain
FUNCTION_MENU = windowMenu
FLAGS = NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE, HANDLE_CTRL_TAB
MIN_SIZE = 200, 200
PADDING = 0
SIZE = 800, 640